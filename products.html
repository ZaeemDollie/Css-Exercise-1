<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Products</title>
  </head>

  <body>
    <header>
      <h1>Products</h1>
      <main>
        <section class="Product">
          <img src="image1.jpg" alt="Product 1" />
          <h2>Bags</h2>
          <price>R1299</price>
          <btn class="btn">Add to Cart</btn>
        </section>

        <section class="Product">
          <img src="image2.jpg" alt="Product 2" />
          <h2>Backpacks</h2>
          <price>R1599</price>
          <btn class="btn">Add to Cart</btn>
        </section>

        <section class="Product">
          <img src="image3.jpg" alt="Product 3" />
          <h2>Belts</h2>
          <price>R200</price>
          <btn class="btn">Add to Cart</btn>
        </section>

        <section class="Product">
          <img src="image4.jpg" alt="Product 4" />
          <h2>Sunglasses</h2>
          <price>R399</price>
          <btn class="btn">Add to Cart</btn>
        </section>

        <section class="Product">
          <img src="image5.jpg" alt="Product 5" />
          <h2>Mousepads</h2>
          <price>R199</price>
          <btn class="btn">Add to Cart</btn>
        </section>

        <section class="Product">
          <img src="image6.jpg" alt="Product 6" />
          <h2>Keyboards</h2>
          <price>R1100</price>
          <btn class="btn">Add to Cart</btn>
        </section>
      </main>
    </header>
  </body>
</html>
